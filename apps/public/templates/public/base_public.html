<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}BarberAgenda{% endblock %}
    </title>

    <style>
        :root {
            --bg: #090909;
            --card: #151515;
            --border: #292929;
            --text: #ffffff;
            --muted: #969696;
            --gold: #d4af37;
            --gold-dark: #9f7d1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: var(--bg);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1180px, 92%);
            margin: 0 auto;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(9, 9, 9, .94);
            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(12px);
        }

        .navbar {
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 24px;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
        }

        .logo span {
            color: var(--gold);
        }

        .nav {
            display: flex;
            align-items: center;

            gap: 22px;
        }

        .nav a {
            color: var(--muted);

            font-size: 14px;
            font-weight: 600;
        }

        .nav a:hover {
            color: white;
        }

        .nav-actions {
            display: flex;
            align-items: center;

            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 10px 17px;

            border: 0;
            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    var(--gold),
                    var(--gold-dark)
                );

            color: #050505;

            font-weight: 900;

            cursor: pointer;
        }

        .btn-outline {
            border: 1px solid var(--border);
            background: transparent;
            color: white;
        }

        main {
            min-height: calc(100vh - 72px);
        }

        @media(max-width: 720px) {
            .nav {
                display: none;
            }

            .navbar {
                gap: 10px;
            }

            .nav-actions .btn-outline {
                display: none;
            }
        }
    </style>

    {% block extra_css %}
    {% endblock %}
</head>

<body>

<header class="header">

    <div class="container navbar">

        <a
            href="{% url 'public:home' %}"
            class="logo"
        >
            Barber<span>Agenda</span>
        </a>


        <nav class="nav">

            <a href="{% url 'public:home' %}">
                Início
            </a>

            <a href="{% url 'public:plans' %}">
                Planos
            </a>

        </nav>


        <div class="nav-actions">

            <a
                href="{% url 'login' %}"
                class="btn btn-outline"
            >
                Entrar
            </a>

            <a
                href="{% url 'public:register' %}"
                class="btn"
            >
                Criar conta
            </a>

        </div>

    </div>

</header>


<main>
    {% block content %}
    {% endblock %}
</main>


{% block extra_js %}
{% endblock %}

</body>
</html>
